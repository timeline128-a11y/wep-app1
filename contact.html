<!DOCTYPE html>

  <meta charset="UTF-8"/>

  <link rel="stylesheet" href="CSS/style.css"/>

<body>

<!-- Gold particle canvas -->
<canvas id="particles"></canvas>

<!-- ─── HERO BG ─── -->
<div class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
</div>

<!-- ─── MAIN CONTENT ─── -->
<div class="container">

  <!-- AVATAR + NAME -->
  <div class="avatar-section fade-up">
    <div class="avatar-ring">
      <div class="ring-spin-reverse"></div>
      <div class="ring-spin"></div>
      <img class="avatar-img" src="images/photo.png" alt="วรภพ จันทร์เสวก"/>
    </div>

    <div class="name-block">
      <div class="name-prefix">· Contact Card ·</div>
      <div class="fullname">วรภพ จันทร์เสวก</div>
    </div>

    <div class="badges fade-up delay-1">
      <div class="badge badge-gold">💬 ไทม์</div>
      <div class="badge badge-white">🏫 ม.4/10 &nbsp;·&nbsp; เลขที่ 5</div>
    </div>
  </div>

  <div class="gold-divider fade-up delay-2"></div>

  <!-- PERSONAL INFO -->
  <div class="section fade-up delay-3">
    <div class="section-label">📋 ข้อมูลส่วนตัว</div>
    <div class="glass-card">

      <div class="info-row">
        <div class="info-icon">🎂</div>
        <div class="info-content">
          <div class="info-label">วัน เดือน ปีเกิด</div>
          <div class="info-value">19 พฤษภาคม 2554</div>
        </div>
      </div>

      <div class="info-row">
        <div class="info-icon">🎉</div>
        <div class="info-content">
          <div class="info-label">อายุปัจจุบัน</div>
          <div class="info-value">15 ปี</div>
        </div>
      </div>

    </div>
  </div>

  <!-- CONTACT INFO -->
  <div class="section fade-up delay-4">
    <div class="section-label">📞 ข้อมูลติดต่อ</div>
    <div class="glass-card">

      <div class="info-row">
        <div class="info-icon">📧</div>
        <div class="info-content">
          <div class="info-label">อีเมล์</div>
          <div class="info-value">timeline128@gmail.com</div>
        </div>
      </div>

      <div class="info-row">
        <div class="info-icon">💚</div>
        <div class="info-content">
          <div class="info-label">ไอดี Line</div>
          <div class="info-value">time190554</div>
        </div>
      </div>

      <div class="info-row">
        <div class="info-icon">📱</div>
        <div class="info-content">
          <div class="info-label">เบอร์โทรศัพท์</div>

  <div class="footer fade-up delay-5">
    ม.4/10 &nbsp;<span>·</span>&nbsp; ปีการศึกษา 2569
  </div>

</div>

<!-- ─── PARTICLE JS ─── -->
<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const COLORS = ['#f5c842','#e8a020','#ffeaa0','#fffbe6'];

class Particle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x   = Math.random() * canvas.width;
    this.y   = init ? Math.random() * canvas.height : canvas.height + 10;
    this.r   = Math.random() * 1.8 + 0.3;
    this.vy  = -(Math.random() * 0.5 + 0.2);
    this.vx  = (Math.random() - 0.5) * 0.3;
    this.alpha = Math.random() * 0.7 + 0.2;
    this.da  = (Math.random() * 0.008 + 0.002) * (Math.random() < 0.5 ? 1 : -1);
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.life  = 0;
    this.maxLife = Math.random() * 300 + 150;
    // sparkle shape: 0=circle, 1=cross, 2=diamond
    this.shape = Math.floor(Math.random() * 3);
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.alpha += this.da;
    if (this.alpha > 0.9) this.da = -Math.abs(this.da);
    if (this.alpha < 0.05) this.da = Math.abs(this.da);
    this.life++;
    if (this.y < -20 || this.life > this.maxLife) this.reset(false);
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha));
    ctx.fillStyle = this.color;
    ctx.strokeStyle = this.color;
    ctx.translate(this.x, this.y);

    if (this.shape === 0) {
      ctx.beginPath();
      ctx.arc(0, 0, this.r, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.shape === 1) {
      const s = this.r * 2.5;
      ctx.lineWidth = this.r * 0.7;
      ctx.beginPath(); ctx.moveTo(-s,0); ctx.lineTo(s,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(0,s); ctx.stroke();
    } else {
      const s = this.r * 2;
      ctx.beginPath();
      ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

const particles = Array.from({ length: 90 }, () => new Particle());

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
